<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="80" viewBox="0 0 1440 80" fill="none">
  <style>
    .signal-pulse { stroke-dasharray:48 2052; animation:signal-flow 8s linear infinite; }
    .output-pulse { stroke-dasharray:30 1370; animation:output-flow 8s linear infinite; }
    .feedback-pulse { stroke-dasharray:22 978; animation:feedback-flow 8s linear infinite; }
    @keyframes signal-flow { 0% { stroke-dashoffset:48; } 50% { stroke-dashoffset:-952; } 52.4%,100% { stroke-dashoffset:-1000; } }
    @keyframes output-flow { 0%,50% { stroke-dashoffset:30; } 87%,100% { stroke-dashoffset:-650; } }
    @keyframes feedback-flow { 0%,50% { stroke-dashoffset:22; } 76%,100% { stroke-dashoffset:-450; } }
    @media(prefers-reduced-motion:reduce) { .signal-pulse,.output-pulse,.feedback-pulse { display:none; } }
  </style>
  <g stroke="#64F6D2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Input resistor, inverting amplifier, and output. -->
    <path d="M0 36H178L184 28L196 44L208 28L220 44L232 28L238 36H490L496 27L508 45L520 27L532 45L544 27L550 36H690"/>
    <path d="M690 20L790 48L690 76Z M790 48H970L976 40L988 56L1000 40L1012 56L1024 40L1030 48H1440"/>
    <!-- Negative feedback, with a second resistor on the upper branch. -->
    <path d="M660 36V8H724L730 2L742 14L754 2L766 14L778 2L784 8H850V48"/>
    <!-- Non-inverting reference input and ground. -->
    <path d="M690 60H650V68 M640 68H660 M644 73H656 M648 78H652" stroke="#398080"/>
    <path d="M700 36H710 M700 60H710 M705 55V65"/>
  </g>
  <g fill="#080F14" stroke="#64F6D2" stroke-width="1.5">
    <circle cx="660" cy="36" r="3"/>
    <circle cx="850" cy="48" r="4"/>
  </g>
  <!-- Input RC low-pass branch, output RC filter, and resistive load.
       Feedback is taken before output isolation resistance. -->
  <g stroke="#64F6D2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M340 36V52 M328 52H352 M328 59H352 M340 59V70 M330 70H350 M334 74H346 M338 78H342"/>
    <path d="M1140 48V57 M1128 57H1152 M1128 64H1152 M1140 64V70 M1130 70H1150 M1134 74H1146 M1138 78H1142"/>
    <path d="M1300 48V51L1293 54L1307 58L1293 62L1307 66L1300 69V70 M1290 70H1310 M1294 74H1306 M1298 78H1302"/>
    <!-- Test points attach to the signal line without interrupting it. -->
    <path d="M90 36V22 M420 36V22 M1220 48V25" stroke="#398080"/>
    <circle cx="90" cy="18" r="4"/><circle cx="420" cy="18" r="4"/><circle cx="1220" cy="21" r="4"/>
  </g>
  <g fill="#64F6D2">
    <circle cx="340" cy="36" r="2.3"/><circle cx="1140" cy="48" r="2.3"/><circle cx="1300" cy="48" r="2.3"/>
  </g>
  <!-- At 50% the incoming pulse reaches the output junction; both branches start together. -->
  <g stroke="#E6BC68" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <path class="signal-pulse" pathLength="1000" d="M0 36H178L184 28L196 44L208 28L220 44L232 28L238 36H490L496 27L508 45L520 27L532 45L544 27L550 36H657A3 3 0 0 1 663 36H690V20L790 48H846A4 4 0 0 1 850 44"/>
    <path class="output-pulse" pathLength="650" d="M850 44A4 4 0 0 1 854 48H970L976 40L988 56L1000 40L1012 56L1024 40L1030 48H1440"/>
    <path class="feedback-pulse" pathLength="450" d="M850 44V8H784L778 2L766 14L754 2L742 14L730 2L724 8H660V33"/>
  </g>
</svg>
